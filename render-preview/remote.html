<!doctype html><html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ONYX GRID — Remote Control</title><style>:root{color-scheme:dark}body{background:#090b0e;color:#eee;font:15px system-ui;margin:0}header{background:#15181d;border-bottom:2px solid #ebd328;padding:18px 24px;display:flex;justify-content:space-between}h1{color:#ebd328;margin:0;font-size:23px}main{max-width:1100px;margin:24px auto;padding:0 18px}.panel{background:#16191e;border:1px solid #30343b;padding:20px;margin-bottom:16px}h2{font-size:17px;color:#ebd328}button{background:#292e35;color:white;border:1px solid #535961;padding:12px 15px;margin:4px;cursor:pointer}button:hover{border-color:#ebd328}.take{background:#ebd328;color:#121212;font-weight:800}input,select{background:#0b0d10;border:1px solid #525860;color:white;padding:10px;margin:5px;max-width:100%}label{display:inline-flex;flex-direction:column;margin:8px}#status{color:#ebd328}a{color:#ebd328}</style><header><h1>ONYX GRID / REMOTE DIRECTOR</h1><span id="health">Connecting…</span></header><main><div class="panel"><h2>SCENE TAKE</h2><div id="scenes"></div><p>OBS scenes must already exist with names such as <b>ONYX STARTING</b> and <b>ONYX LIVE</b>.</p></div><div class="panel"><h2>LIVE POV</h2><div id="povs"></div><label>Live layout<select id="mode"><option value="multiview">Multiview</option><option value="focus">Focus</option><option value="fullscreen">Fullscreen</option></select></label><button id="apply">Apply POV / layout</button></div><div class="panel"><h2>MATCH</h2><label>Event<input id="event"></label><label>Stage<input id="stage"></label><label>Team A<input id="teamA"></label><label>Score A<input type="number" min="0" id="scoreA"></label><label>Score B<input type="number" min="0" id="scoreB"></label><label>Team B<input id="teamB"></label><label>Scoreboard<select id="scoreEnabled"><option value="true">On</option><option value="false">Off</option></select></label><button id="save">Save and synchronize</button></div><div class="panel"><h2>COUNTDOWN</h2><label>Seconds<input type="number" id="seconds" value="300" min="0"></label><button data-timer="reset">Reset</button><button data-timer="start">Start</button><button data-timer="pause">Pause</button></div><div class="panel"><h2>OTHER PANELS</h2><a href="/dock.html">Original Dock</a> · <a href="/director.html">Director</a> · <a href="/hub.html">Guest Hub</a> · <a href="/overlay.html?scene=live" target="_blank">Live Overlay</a></div><p id="status" role="status"></p></main><script>let cfg;const $=id=>document.getElementById(id),scenes=['starting','live','casters','interview','chatting','game','break','ending'];async function get(url){const r=await fetch(url,{cache:'no-store'});if(!r.ok)throw Error(await r.text());return r.json()}async function post(url,obj){const r=await fetch(url,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(obj)});const d=await r.json();if(!r.ok)throw Error(d.error);return d}async function run(fn){try{await fn();$('status').textContent='Saved / command sent at '+new Date().toLocaleTimeString()}catch(e){$('status').textContent='ERROR: '+e.message}}function collect(){cfg.event=$('event').value;cfg.stage=$('stage').value;cfg.liveMode=$('mode').value;cfg.focusIndex=Number(document.querySelector('input[name=pov]:checked')?.value||0);cfg.scoreboard={...cfg.scoreboard,teamA:$('teamA').value,teamB:$('teamB').value,scoreA:Number($('scoreA').value),scoreB:Number($('scoreB').value),enabled:$('scoreEnabled').value==='true'};return cfg}async function save(){cfg=(await post('/api/config',collect())).config}async function init(){cfg=await get('/api/config');$('event').value=cfg.event||'';$('stage').value=cfg.stage||'';$('mode').value=cfg.liveMode||'multiview';for(const k of ['teamA','teamB','scoreA','scoreB'])$(k).value=cfg.scoreboard?.[k]??'';$('scoreEnabled').value=String(cfg.scoreboard?.enabled===true);$('povs').innerHTML=cfg.players.map((p,i)=>'<label><input type="radio" name="pov" value="'+i+'" '+(i===cfg.focusIndex?'checked':'')+'>'+String(p.name).replaceAll('<','&lt;')+'</label>').join('');$('scenes').innerHTML=scenes.map(x=>'<button class="take" data-scene="'+x+'">'+x.toUpperCase()+'</button>').join('');document.querySelectorAll('[data-scene]').forEach(b=>b.onclick=()=>run(async()=>{await save();cfg.selectedScene=b.dataset.scene;await save();await post('/api/obs/command',{requestType:'SetCurrentProgramScene',requestData:{sceneName:'ONYX '+b.dataset.scene.toUpperCase()}})}));$('save').onclick=()=>run(save);$('apply').onclick=()=>run(save);document.querySelectorAll('[data-timer]').forEach(b=>b.onclick=()=>run(async()=>{cfg=(await post('/api/timer',{action:b.dataset.timer,seconds:Number($('seconds').value)})).config}));setInterval(async()=>{try{const h=await get('/api/health');$('health').textContent=h.bridgeOnline?'OBS bridge online':'OBS bridge offline'}catch{}},3000)}init().catch(e=>$('status').textContent=e.message)</script></html>
