<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store"><title>ONYX GRID · Hosted Overlay Preview</title>
<style>
:root{--yellow:#efc500;--bg:#101114}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;color:white;font-family:Inter,Arial,sans-serif}main{position:absolute;inset:0;overflow:hidden;background:var(--bg)}main:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 119px,#ffffff08 120px),linear-gradient(135deg,#22252b,#0b0c0e 70%)}header,footer{position:absolute;left:5%;right:5%;z-index:2;display:flex;align-items:center;justify-content:space-between}header{top:6%;font-size:21px;letter-spacing:.2em;font-weight:800}header b{color:var(--yellow)}header small,footer{font-size:12px;color:#a5a8ad;letter-spacing:.2em}footer{bottom:6%;border-top:1px solid #444;padding-top:18px}.center{position:absolute;z-index:2;left:10%;top:39%}.eyebrow{color:var(--yellow);letter-spacing:.35em;font-size:15px;font-weight:700}.hero{font-size:clamp(60px,9vw,180px);font-weight:900;line-height:.91;letter-spacing:-.065em;margin:20px 0}.hero span{color:var(--yellow)}.subtitle{font-size:20px;letter-spacing:.18em;color:#b8bbc0}.side{position:absolute;right:7%;top:26%;font-size:clamp(100px,19vw,350px);font-weight:900;color:#ffffff08;transform:rotate(-15deg)}.livegrid{position:absolute;inset:21% 4% 16%;display:grid;grid-template-columns:repeat(3,1fr);gap:1%}.feed{border:2px solid #555;background:#08090b;position:relative;overflow:hidden}.feed iframe{width:100%;height:100%;border:0}.feed .placeholder{position:absolute;inset:0;display:grid;place-items:center;color:#888;font-size:17px;letter-spacing:.1em}.feed label{position:absolute;bottom:0;left:0;right:0;background:#17181de8;border-top:2px solid var(--yellow);padding:16px;font-weight:800}.studio{position:absolute;left:9%;right:9%;top:30%;display:grid;grid-template-columns:repeat(3,1fr);gap:2%}.person{border:2px solid #555;background:#1a1b20;height:36vh;display:flex;align-items:end;padding:25px;font-size:25px;font-weight:800;border-bottom:4px solid var(--yellow)}.note{position:absolute;z-index:5;top:5px;right:5px;color:#777;font-size:10px}
</style></head><body><main id="screen"></main><script>
const params=new URLSearchParams(location.search);const scene=(params.get('scene')||'starting').toLowerCase();const event=(params.get('event')||'ONYX TRACKMANIA').slice(0,80);const stage=(params.get('stage')||'MATCH DAY').slice(0,80);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const screen=document.querySelector('#screen');const head='<header><div>ONYX <b>GRID</b></div><small>'+esc(event)+' / '+esc(stage)+'</small></header>';const foot='<footer><span>ONYX / GRID — INDEPENDENT TEAMCAST</span><span>'+esc(stage)+'</span><span>TRACKMANIA / BROADCAST</span></footer>';const title=(eye,h1,sub)=>head+'<div class="side">◈</div><div class="center"><div class="eyebrow">'+eye+'</div><h1 class="hero">'+h1+'</h1><div class="subtitle">'+sub+'</div></div>'+foot;
if(scene==='starting')screen.innerHTML=title('01 / PRE-SHOW TRANSMISSION','STARTING<br><span>SOON.</span>','THE GRID IS WARMING UP');
else if(scene==='break')screen.innerHTML=title('02 / SIGNAL HOLD','BE RIGHT<br><span>BACK.</span>','THE SHOW CONTINUES SHORTLY');
else if(scene==='ending')screen.innerHTML=title('03 / END OF TRANSMISSION','THANKS FOR<br><span>WATCHING.</span>','SEE YOU ON THE NEXT GRID');
else if(scene==='game')screen.innerHTML=head+foot;
else if(scene==='live'){screen.innerHTML=head+'<div class="livegrid">'+[1,2,3].map(i=>'<div class="feed"><div class="placeholder">POV '+i+' / NOT CONNECTED</div><label>0'+i+' / ONYX</label></div>').join('')+'</div>'+foot;}
else if(['casters','interview','chatting'].includes(scene))screen.innerHTML=head+'<div class="studio">'+[1,2,3].map(i=>'<div class="person">CASTER 0'+i+'</div>').join('')+'</div>'+foot;
else screen.innerHTML=title('ONYX GRID','BROADCAST<br><span>READY.</span>','SCENE NOT CONFIGURED');
</script></body></html>
