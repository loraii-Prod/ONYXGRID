<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ONYX GRID — Sign in</title><style>body{background:#0a0b0d;color:#f3d522;font:16px system-ui;display:grid;place-items:center;min-height:100vh;margin:0}main{background:#17191d;padding:40px;width:min(400px,85vw);border:1px solid #554c19}input,button{box-sizing:border-box;width:100%;padding:14px;margin-top:14px;font:inherit}button{background:#f3d522;border:0;color:#111;font-weight:800;cursor:pointer}input{background:#090a0c;color:white;border:1px solid #666}small{color:#ccc}</style><main><h1>ONYX GRID</h1><p>PRODUCTION CONTROL</p><form id="f"><input type="password" id="p" placeholder="Admin password" autocomplete="current-password" required><button>Sign in</button></form><p id="status" role="status"></p><small>Authorized crew only</small></main><script>document.querySelector('#f').onsubmit=async e=>{e.preventDefault();const status=document.querySelector('#status');status.textContent='Signing in…';try{const r=await fetch('/api/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({password:document.querySelector('#p').value})});if(!r.ok)throw Error((await r.json()).error);location.href='/dock.html'}catch(err){status.textContent=err.message}}</script></html>
