<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ONYX POV Director</title><link rel="stylesheet" href="/style.css?v=grid530"><style>body{background:#0d0f0f;color:#f4f2e9;font-family:Arial,sans-serif;padding:22px}.minihead{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.minihead strong{font-size:24px}.minihead span{font:13px Arial,sans-serif;color:#e8d324}.director-grid{margin-top:24px}input{max-width:100%}.msg{padding:12px;background:#202321;color:#e8d324;margin-top:12px;font:14px Arial,sans-serif}</style></head><body><div class="minihead"><strong>ONYX / DIRECTOR</strong><span>WATCH PARTY</span></div><label>OBS WebSocket password (if configured)<input id="password" type="password" placeholder="Optional"></label><div class="director-grid"><button class="director-button" data-i="0">01 <strong>ONYX BLACK</strong><small>FOCUS</small></button><button class="director-button" data-i="1">02 <strong>ONYX WHITE</strong><small>FOCUS</small></button><button class="director-button" data-i="2">03 <strong>ONYX ACADEMY</strong><small>FOCUS</small></button><button class="director-button director-all" data-i="multi">▦ <strong>ALL THREE</strong><small>MULTIVIEW</small></button><button type="button" data-i="full-0" class="director-button director-full">⛶ <strong>BLACK FULLSCREEN</strong><small>FULL FRAME / NO RELOAD</small></button><button type="button" data-i="full-1" class="director-button director-full">⛶ <strong>WHITE FULLSCREEN</strong><small>FULL FRAME / NO RELOAD</small></button><button type="button" data-i="full-2" class="director-button director-full">⛶ <strong>ACADEMY FULLSCREEN</strong><small>FULL FRAME / NO RELOAD</small></button></div><div class="msg" id="status">Ready. OBS WebSocket must be enabled on port 4455.</div><p style="font-size:14px;color:#c4cbc4">Alt+1–4 for focus/multiview, Alt+5–7 for fullscreen while this dock is focused.</p><script src="/director.js?v=23"></script></body></html>
